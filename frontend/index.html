<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG favicons and composites a transparent icon onto
         black, so the home-screen icon is a separate opaque PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>MicroMart — Computers &amp; Electronics in Bangladesh</title>
    <meta
      name="description"
      content="Shop laptops, desktops, components and accessories at MicroMart. Genuine stock, official warranty and cash on delivery across Bangladesh."
    />

    <!-- Social previews. These have to be in the HTML itself: Facebook and
         WhatsApp do not run JavaScript, so tags added by React arrive too
         late for a shared link. lib/seo.js still handles per-page titles. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MicroMart" />
    <meta property="og:title" content="MicroMart — Computers &amp; Electronics in Bangladesh" />
    <meta
      property="og:description"
      content="Shop laptops, desktops, components and accessories at MicroMart. Genuine stock, official warranty and cash on delivery across Bangladesh."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
